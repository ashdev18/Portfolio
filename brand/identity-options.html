<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><title>Ash Dev Identity Options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Gabarito:wght@500;700;800&family=Michroma&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&family=Urbanist:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
<style>
/* Presentation chrome: a quiet gallery wall. Each concept board carries its own palette as variables. */
:root {
  --wall: #ECECE8; --wall-2: #E2E2DD; --text: #1C1D1B; --text-2: #62645F; --rule: #CFCFC9;
  --ui: "Instrument Sans", system-ui, sans-serif;
  --ui-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --wall: #161716; --wall-2: #1F201E; --text: #ECECE8; --text-2: #A2A49E; --rule: #343531; color-scheme: dark; }
}
:root[data-theme="dark"] { --wall: #161716; --wall-2: #1F201E; --text: #ECECE8; --text-2: #A2A49E; --rule: #343531; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--wall); color: var(--text); font: 400 15px/1.5 var(--ui); }
.page { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 72px; display: grid; gap: 64px; }
.intro { display: grid; gap: 22px; }
.intro h1 { margin: 0; font: 600 clamp(28px, 4vw, 44px)/1.05 var(--ui); letter-spacing: -.02em; text-wrap: balance; }
.intro p { margin: 0; color: var(--text-2); max-width: 66ch; }
.index { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.index a { display: grid; gap: 10px; text-decoration: none; color: inherit; padding: 12px; border-radius: 14px; background: var(--wall-2); border: 1px solid var(--rule); }
.index a:hover { border-color: var(--text-2); }
.index .sw { aspect-ratio: 16 / 10; max-width: 100%; border-radius: 10px; display: grid; place-items: center; overflow: hidden; background: var(--c-plate); }
.index .sw > div { width: 34%; }
.index img { display: block; width: 100%; border-radius: 50%; }
.index b { font-weight: 600; font-size: 14px; }
.index small { font: 500 11px/1 var(--ui-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }

.concept { display: grid; gap: 16px; scroll-margin-top: 24px; }
.concept-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.concept-head .tag { font: 500 11px/1 var(--ui-mono); letter-spacing: .1em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; border: 1px solid var(--rule); color: var(--text-2); }
.concept-head h2 { margin: 0; font: 600 26px/1.1 var(--ui); letter-spacing: -.01em; }
.concept-head p { margin: 0; color: var(--text-2); flex-basis: 100%; max-width: 72ch; }
.picker { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.picker > span { font: 500 11px/1 var(--ui-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); margin-right: 4px; }
.picker button { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; border: 1px solid var(--rule); background: var(--wall-2); color: var(--text); font: 500 13px/1 var(--ui); cursor: pointer; }
.picker button[aria-pressed="true"] { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.picker i { display: flex; width: 34px; height: 22px; border-radius: 999px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(128,128,128,.3); }
.picker i b { flex: 1; }

/* ---- Concept board (all colours come from variables set per palette) ---- */
.board { --r: 18px; background: var(--c-bg); color: var(--c-ink); border-radius: 24px; padding: clamp(14px, 2.4vw, 28px); display: grid; gap: clamp(14px, 2vw, 22px); font-family: var(--c-body); overflow: hidden; transition: background-color .3s; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: clamp(14px, 2vw, 22px); }
.card { background: var(--c-surface); color: var(--c-ink); border-radius: var(--r); min-width: 0; overflow: hidden; position: relative; box-shadow: var(--c-edge, none); }
.cap { position: absolute; left: 14px; top: 12px; font: 500 10px/1 var(--ui-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--c-muted); z-index: 3; }
.replay { position: absolute; right: 12px; top: 8px; z-index: 3; border: 0; background: transparent; color: var(--c-muted); font: 500 10px/1 var(--ui-mono); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; padding: 4px; }
.replay:hover { color: var(--c-ink); }
:focus-visible { outline: 2px solid var(--text-2); outline-offset: 2px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }

.plate { display: grid; place-items: center; min-height: 360px; padding: 52px 24px 40px; background: var(--c-plate); }
.plate .cap, .plate .replay { color: var(--c-tl); }
.lockup { display: flex; align-items: center; gap: clamp(14px, 2vw, 26px); }
.lockup .mk { width: clamp(80px, 10vw, 124px); flex: none; }
.lockup .mk img, .nav img, .yt img, .ka img, .work img, .move img, .marks img { display: block; width: 100%; border-radius: 50%; }
.lockup .wm { font-family: var(--c-display); color: var(--c-wm); line-height: .9; white-space: nowrap; }
.lockup .wm span { display: inline-block; }
.lockup .wm .acc { color: var(--c-accent); }
.lockup .tl { display: block; font: 500 12px/1.2 var(--c-body); letter-spacing: .16em; text-transform: uppercase; color: var(--c-tl); margin-top: 12px; }

.side { display: grid; gap: clamp(14px, 2vw, 22px); grid-template-rows: auto 1fr; }
.marks { display: flex; gap: 14px; align-items: flex-end; padding: 40px 18px 18px; flex-wrap: wrap; }
.marks > div { flex: none; }
.marks .tilebox { border-radius: 24%; background: var(--c-tile); display: grid; place-items: center; }
.marks .tilebox > div { width: 80%; }
.palette { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); min-height: 150px; }
.palette div { display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; gap: 2px; min-width: 0; }
.palette div:first-child { box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .3); }
.palette b { font: 600 12px/1.2 var(--c-body); }
.palette code { font: 400 10.5px/1 var(--ui-mono); opacity: .8; }

.emotions { padding: 44px clamp(14px, 2vw, 22px) 18px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.emotions.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.emo { display: grid; gap: 10px; justify-items: center; text-align: center; }
.emo .face { width: 100%; max-width: 120px; }
.emo .face.boxed { background: var(--c-tile); border-radius: 22%; padding: 14px; max-width: 132px; }
.emo b { font: 600 13px/1.1 var(--c-body); display: block; }
.emo span { font-size: 12px; color: var(--c-muted); }

.browser { background: var(--c-surface); border-radius: var(--r); overflow: hidden; box-shadow: var(--c-edge, none); }
.chrome { display: flex; align-items: center; gap: 6px; padding: 10px 14px; background: rgba(128, 128, 128, .12); }
.chrome i { width: 9px; height: 9px; border-radius: 50%; background: rgba(128, 128, 128, .4); }
.chrome span { margin-left: 10px; font: 400 11px/1 var(--ui-mono); opacity: .6; padding: 5px 10px; border-radius: 6px; background: rgba(128, 128, 128, .14); color: var(--c-site-ink); }
.site { background: var(--c-site); color: var(--c-site-ink); }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px clamp(16px, 3vw, 36px); }
.nav .lk { display: flex; align-items: center; gap: 10px; font-family: var(--c-display); font-size: 20px; }
.nav .lk .mk { width: 36px; }
.nav ul { display: flex; gap: clamp(10px, 2vw, 26px); list-style: none; margin: 0; padding: 0; font-size: 14px; }
.nav li:last-child { font-weight: 600; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(18px, 3vw, 40px); align-items: center; padding: clamp(18px, 3vw, 36px) clamp(16px, 3vw, 36px) clamp(26px, 4vw, 48px); }
.hero h3 { margin: 0 0 14px; font-family: var(--c-display); font-size: clamp(34px, 5vw, 62px); line-height: .98; text-wrap: balance; }
.hero h3 em { font-style: normal; color: var(--c-accent); }
.hero p { margin: 0 0 22px; max-width: 38ch; opacity: .8; font-size: 16px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: var(--c-btn-r, 999px); font-weight: 600; font-size: 14px; background: var(--c-brand); color: var(--c-on-brand); }
.btn.alt { background: transparent; color: inherit; box-shadow: inset 0 0 0 1.5px currentColor; }
.visual { aspect-ratio: 4 / 3; max-width: 100%; border-radius: var(--c-vis-r, 20px); background: center / cover no-repeat; position: relative; overflow: hidden; }
.visual .badge { position: absolute; right: 12px; bottom: 12px; width: 26%; background: var(--c-tile); border-radius: 22%; padding: 10px; }
.visual .tag { position: absolute; left: 14px; bottom: 14px; background: var(--c-plate); color: var(--c-wm); padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.panel { aspect-ratio: 4 / 3; max-width: 100%; border-radius: var(--c-vis-r, 14px); background: var(--c-soft); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px; align-items: end; }
.panel .big { grid-column: 1; grid-row: 1 / 3; align-self: center; }
.panel .shot { grid-column: 2; aspect-ratio: 4 / 3; border-radius: 10px; background: center / cover no-repeat; }
.works { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 0 clamp(16px, 3vw, 36px) clamp(22px, 3vw, 36px); }
.work { display: grid; gap: 8px; font-size: 13px; }
.work .th { aspect-ratio: 16 / 10; max-width: 100%; border-radius: calc(var(--c-vis-r, 20px) * .6); background: center / cover no-repeat; display: grid; place-items: center; overflow: hidden; }
.work .th.tl { background: var(--c-tile); }
.work .th > div { width: 32%; }
.work b { font-size: 14px; display: block; }
.work span { opacity: .65; }

.yt { min-height: 230px; display: grid; place-items: center; position: relative; overflow: hidden; padding: 40px 20px 22px; background: var(--c-yt); color: var(--c-yt-ink); }
.yt .cap { color: var(--c-yt-ink); opacity: .6; }
.yt .safe { display: flex; align-items: center; gap: clamp(10px, 2vw, 22px); position: relative; }
.yt .mk { width: clamp(56px, 7.5vw, 96px); flex: none; }
.yt .wm { font-family: var(--c-display); font-size: clamp(26px, 4.4vw, 56px); line-height: .9; }
.yt small { display: block; font-size: clamp(10px, 1.1vw, 13px); letter-spacing: .14em; text-transform: uppercase; opacity: .75; margin-top: 8px; }
.ka { aspect-ratio: 3 / 2; max-width: 100%; position: relative; overflow: hidden; display: grid; grid-template-rows: 1fr auto; background: var(--c-ka); color: var(--c-ka-ink); }
.ka .cap { color: var(--c-ka-ink); opacity: .7; }
.ka .ph { background: center / cover no-repeat; margin: 6% 6% 0; border-radius: calc(var(--c-vis-r, 14px) * .8); }
.ka .tx { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 5% 6% 6%; }
.ka h4 { margin: 0; font-family: var(--c-display); line-height: .95; font-size: clamp(20px, 2.8vw, 34px); }
.ka small { display: block; font-size: 12px; opacity: .65; margin-bottom: 6px; }
.ka .badge { width: 16%; flex: none; }

/* Fonts and a few shape choices per concept */
.A { --c-display: "Fredoka", sans-serif; --c-body: "Rubik", sans-serif; }
.A .lockup .wm, .A .yt .wm, .A .hero h3, .A .ka h4 { font-weight: 700; }
.A .lockup .wm { font-size: clamp(48px, 7vw, 92px); }
.A .visual { border-radius: 50% 50% 28px 28px / 40% 40% 28px 28px; }
.B { --c-display: "Bricolage Grotesque", sans-serif; --c-body: "Instrument Sans", sans-serif; --c-vis-r: 14px; --c-btn-r: 10px; }
.B .lockup .wm, .B .yt .wm, .B .hero h3, .B .ka h4, .B .nav .lk { font-weight: 800; letter-spacing: -.045em; }
.B .lockup .wm { font-size: clamp(50px, 7.4vw, 96px); }
.C { --c-display: "Gabarito", sans-serif; --c-body: "Gabarito", sans-serif; --c-vis-r: 22px; }
.C .lockup { flex-direction: column; gap: 0; }
.C .lockup .mk { width: clamp(150px, 18vw, 210px); margin-bottom: -22px; position: relative; z-index: 1; }
.C .lockup .wm { font-size: clamp(56px, 8vw, 104px); text-align: center; }
.C .lockup .tl { text-align: center; }
.C .lockup .wm, .C .yt .wm, .C .hero h3, .C .ka h4 { font-weight: 800; letter-spacing: -.04em; }
.C .hero .peek { width: 128px; margin: 0 0 -16px -6px; position: relative; z-index: 1; }
.D { --c-display: "Michroma", sans-serif; --c-body: "IBM Plex Sans", sans-serif; --c-vis-r: 4px; --c-btn-r: 4px; }
.D .lockup .wm { font-size: clamp(28px, 4.2vw, 54px); letter-spacing: .08em; }
.D .lockup .tl { letter-spacing: .3em; }
.D .hero h3 { font-size: clamp(26px, 3.6vw, 46px); line-height: 1.1; }
.D .nav .lk { font-size: 14px; letter-spacing: .14em; }
.D .yt .wm { font-size: clamp(18px, 3vw, 38px); letter-spacing: .08em; }
.D .ka h4 { font-size: clamp(14px, 1.9vw, 24px); letter-spacing: .04em; line-height: 1.25; }
.D .site, .H .site, .H .plate, .H .yt { background-image: linear-gradient(var(--c-grid, rgba(128,128,128,.07)) 1px, transparent 1px), linear-gradient(90deg, var(--c-grid, rgba(128,128,128,.07)) 1px, transparent 1px); background-size: 28px 28px; }
.E { --c-display: "Baloo 2", sans-serif; --c-body: "Nunito", sans-serif; --c-vis-r: 26px; }
.E .lockup .wm, .E .yt .wm, .E .hero h3, .E .ka h4, .E .nav .lk { font-weight: 800; letter-spacing: -.01em; }
.E .lockup .wm { font-size: clamp(52px, 7.6vw, 100px); }
.E .visual { border-radius: 26px 26px 140px 26px; }
.F { --c-display: "Urbanist", sans-serif; --c-body: "Urbanist", sans-serif; --c-vis-r: 18px; }
.F .lockup { gap: 2px; align-items: flex-end; }
.F .lockup .mk { width: clamp(96px, 12vw, 150px); }
.F .lockup .wm { font-size: clamp(76px, 11vw, 142px); font-weight: 900; letter-spacing: -.04em; line-height: .78; }
.F .lockup .tl { margin-left: 4px; }
.F .yt .wm, .F .hero h3, .F .ka h4, .F .nav .lk { font-weight: 900; letter-spacing: -.035em; }
.G { --c-display: "Bungee", sans-serif; --c-body: "Rubik", sans-serif; --c-vis-r: 12px; --c-btn-r: 12px; }
.G .lockup .wm { font-size: clamp(40px, 6vw, 76px); }
.G .lockup .wm .acc { color: var(--m-main); }
.E .visual .badge { right: auto; left: 12px; }
.G .hero h3 { font-size: clamp(30px, 4.2vw, 52px); line-height: 1.02; }
.G .btn { box-shadow: 0 5px 0 var(--c-btn-shadow, rgba(0,0,0,.35)); }
.G .btn.alt { box-shadow: inset 0 0 0 2px currentColor; }
.H { --c-display: "IBM Plex Mono", monospace; --c-body: "IBM Plex Sans", sans-serif; --c-vis-r: 2px; --c-btn-r: 2px; }
.H .lockup .wm { font-size: clamp(44px, 6.6vw, 84px); font-weight: 600; letter-spacing: -.04em; }
.H .hero h3 { font-weight: 600; letter-spacing: -.04em; font-size: clamp(30px, 4.4vw, 54px); }
.H .yt .wm, .H .ka h4, .H .nav .lk { font-weight: 600; letter-spacing: -.03em; }
.H .visual::after { content: "FIG. 2 · DRIFT ANGLE 34°"; position: absolute; left: 10px; top: 10px; font: 500 10px/1 var(--ui-mono); letter-spacing: .12em; padding: 6px 8px; background: var(--c-site); color: var(--c-site-ink); }

/* A's motion samples */
.moves { padding: 44px 22px 22px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.move { display: grid; gap: 10px; justify-items: center; text-align: center; }
.move .st { width: 100%; max-width: 170px; aspect-ratio: 1 / 1; display: grid; place-items: center; background: var(--c-soft); border-radius: 18px; position: relative; overflow: hidden; }
.move .st img { width: 64%; }
.move b { font-size: 13px; } .move span { font-size: 12px; color: var(--c-muted); }
.note { margin: 0 22px 22px; padding: 12px 14px; border-radius: 12px; background: var(--c-soft); font-size: 13px; color: var(--c-muted); }
.move .float img { animation: floaty 3.6s ease-in-out infinite; }
.move .ring::after { content: ""; position: absolute; width: 64%; aspect-ratio: 1; border-radius: 50%; border: 4px solid var(--c-accent); border-top-color: transparent; border-right-color: transparent; animation: spin 1.1s linear infinite; }
.move .ring img { width: 48%; }
.move .wave img { animation: wave 1.8s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 15% { transform: rotate(-10deg) scale(1.04); } 30% { transform: rotate(8deg); } 45% { transform: rotate(-4deg); } }

/* ---- Mark colours: every mark reads its colours from these ---- */
.f-tile { fill: var(--m-tile); } .f-main { fill: var(--m-main); } .f-maind { fill: var(--m-maind); } .f-body { fill: var(--m-body); }
.f-shade { fill: var(--m-shade); } .f-ink { fill: var(--m-ink); } .f-white { fill: var(--m-white, #fff); } .f-spot { fill: var(--m-spot); }
.f-fx { fill: var(--m-fx); } .f-acc { fill: var(--m-acc); } .f-line { fill: var(--m-line); }
.s-main { stroke: var(--m-main); } .s-maind { stroke: var(--m-maind); } .s-ink { stroke: var(--m-ink); } .s-line { stroke: var(--m-line); }
.s-white { stroke: var(--m-white, #fff); } .s-acc { stroke: var(--m-acc); } .s-spk { stroke: var(--m-spk); } .s-body { stroke: var(--m-body); }
.nf { fill: none; }

/* ---- Character motion ---- */
.ant, .chr, .hatg, .head { transform-box: view-box; }
.eyes { transform-box: fill-box; transform-origin: center; }
.live .chr { animation: bob 3.2s ease-in-out infinite; transform-origin: 50px 90px; }
.live .eyes { animation: blink 4.6s infinite; }
.live .ant { animation: sway 3.2s ease-in-out infinite; }
.live .antR { animation-delay: -.4s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6px); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.live.s-happy .chr { animation: hop 1.3s cubic-bezier(.3, 0, .3, 1) infinite; }
.live.s-happy .ant { animation: flick 1.3s ease-out infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 12% { transform: translateY(0) scale(1.06, .92); } 40% { transform: translateY(-9px) scale(.97, 1.04); } 70% { transform: translateY(0) scale(1.04, .95); } 82% { transform: translateY(0) scale(1, 1); } }
@keyframes flick { 0%, 30%, 100% { transform: rotate(0); } 50% { transform: rotate(-10deg); } 75% { transform: rotate(6deg); } }
.live.s-surprised .hatg { animation: pop 2.4s cubic-bezier(.2, .9, .3, 1.4) infinite; transform-origin: 50px 45px; }
.live.s-surprised .ant { animation: buzz .12s linear infinite; }
.live.s-surprised .chr { animation: jolt 2.4s ease-out infinite; }
@keyframes pop { 0%, 100% { transform: translateY(0); } 8% { transform: translateY(-9px) rotate(-4deg); } 30% { transform: translateY(-3px); } 60% { transform: translateY(0); } }
@keyframes buzz { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
@keyframes jolt { 0%, 100% { transform: translateY(0); } 6% { transform: translateY(-4px); } 20% { transform: translateY(0); } }
.live.s-sleepy .chr { animation: breathe 4.2s ease-in-out infinite; }
.live.s-sleepy .eyes { animation: none; }
.live.s-sleepy .ant { animation: droop 4.2s ease-in-out infinite; }
.live.s-sleepy .z { animation: zz 3s ease-out infinite; opacity: 0; transform-box: fill-box; }
.live.s-sleepy .z2 { animation-delay: 1.5s; }
@keyframes breathe { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(1px) scale(1.02, .98); } }
@keyframes droop { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(5deg); } }
@keyframes zz { 0% { opacity: 0; transform: translate(0, 4px) scale(.7); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(6px, -12px) scale(1.1); } }
.live.s-focused .chr { animation: lean 2.6s ease-in-out infinite; }
.live.s-focused .ant { animation: twitch 2.6s ease-in-out infinite; }
.live.s-focused .eyes { animation: scan 2.6s ease-in-out infinite; }
@keyframes lean { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-2.5deg); } }
@keyframes twitch { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-6deg); } 86% { transform: rotate(2deg); } }
@keyframes scan { 0%, 100% { transform: translateX(0); } 40%, 60% { transform: translateX(2px); } }
.live.s-oops .chr { animation: shake 2.6s ease-in-out infinite; }
.live.s-oops .drop { animation: drip 2.6s ease-in infinite; transform-box: fill-box; }
@keyframes shake { 0%, 60%, 100% { transform: translateX(0) rotate(0); } 64% { transform: translateX(-2px) rotate(-3deg); } 68% { transform: translateX(2px) rotate(3deg); } 72% { transform: translateX(-1.5px) rotate(-2deg); } 76% { transform: translateX(1px); } }
@keyframes drip { 0%, 20% { transform: translateY(0); opacity: 0; } 30% { opacity: 1; } 90% { transform: translateY(10px); opacity: 1; } 100% { transform: translateY(12px); opacity: 0; } }
.live.s-happy .spark { animation: twinkle 1.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.live.s-happy .spark2 { animation-delay: -.6s; }
@keyframes twinkle { 0%, 100% { transform: scale(.4); opacity: .4; } 50% { transform: scale(1); opacity: 1; } }
/* the arcade button presses itself while happy and focused */
.live.btnmark.s-happy .head { animation: press 1.3s cubic-bezier(.3, 0, .3, 1) infinite; }
.live.btnmark.s-happy .chr { animation: none; }
@keyframes press { 0%, 100% { transform: translateY(0); } 15% { transform: translateY(7px) scale(1.02, .96); } 35% { transform: translateY(-2px); } 50% { transform: translateY(0); } }

@keyframes popIn { 0% { transform: scale(0) rotate(-20deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes rise { 0% { transform: translateY(40%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
@keyframes fade { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes hatDrop { 0% { transform: translateY(-60px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(0); } }
@keyframes sprout { 0% { transform: scale(0); } 100% { transform: scale(1); } }
@keyframes tileIn { 0% { transform: scale(.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes slideX { 0% { transform: translateX(-14px); opacity: 0; clip-path: inset(0 100% 0 0); } 100% { transform: none; opacity: 1; clip-path: inset(0 0 0 0); } }

.sting.go .tl { animation: fade .6s ease-out 1.3s both; }

.sting.go.D .wm span { animation-name: slideX; }
.sting.go.E .mk .head { animation: rise .5s cubic-bezier(.2, 1.3, .4, 1) .1s both; }

.sting.go.G .mk .head { animation: press .9s cubic-bezier(.3, 0, .3, 1) .5s both; }
.sting.go.G .mk { animation: popIn .6s cubic-bezier(.2, 1.4, .4, 1) both; }

.sting.go.H .mk .dims { animation: fade .5s ease-out 1.4s both; }

  // ---------- shared face, drawn around (0,0): eyes at x = ±9.5, mouth below ----------
  function face(s, x, y, k = 1, f = "f-ink", st = "s-ink", sx = 1) {
    const eyes = {
      neutral: `<rect class="${f}" x="-15" y="-3" width="11" height="4" rx="1.6"/><rect class="${f}" x="4" y="-3" width="11" height="4" rx="1.6"/><rect class="${f}" x="-13.5" y="3.5" width="8" height="1.8" rx=".9"/><rect class="${f}" x="5.5" y="3.5" width="8" height="1.8" rx=".9"/>`,
      happy: `<path class="${st} nf" d="M-15 2 Q-9.5 -5 -4 2 M4 2 Q9.5 -5 15 2" stroke-width="3.2" stroke-linecap="round"/>`,
      surprised: `<circle class="${f}" cx="-9.5" cy="0" r="4.4"/><circle class="${f}" cx="9.5" cy="0" r="4.4"/>`,
      sleepy: `<path class="${st} nf" d="M-15 0 Q-9.5 3 -4 0 M4 0 Q9.5 3 15 0" stroke-width="2.8" stroke-linecap="round"/>`,
      focused: `<path class="${st}" d="M-16 -5 L-4 -2 M4 -2 L16 -5" stroke-width="3.2" stroke-linecap="round"/><circle class="${f}" cx="-8.5" cy="2" r="2.6"/><circle class="${f}" cx="10.5" cy="2" r="2.6"/>`,
      oops: `<path class="${st} nf" d="M-14 -3.5 L-6 0 L-14 3.5 M14 -3.5 L6 0 L14 3.5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`
    }[s];
    const mouth = {
      neutral: `<rect class="${f}" x="-4.5" y="9" width="9" height="3" rx="1.5"/>`,
      happy: `<path class="${f}" d="M-6 8.5 Q0 15 6 8.5 Z"/>`,
      surprised: `<ellipse class="${f}" cx="0" cy="11.5" rx="3" ry="3.6"/>`,
      sleepy: `<path class="${st}" d="M-3.5 10.5 H3.5" stroke-width="2.2" stroke-linecap="round"/>`,
      focused: `<path class="${st}" d="M-5 10.5 L5 9.5" stroke-width="2.6" stroke-linecap="round"/>`,
      oops: `<path class="${st} nf" d="M-6.5 11 q1.6 -2 3.2 0 q1.6 2 3.3 0 q1.6 -2 3.3 0 q1.6 2 3.2 0" stroke-width="2" stroke-linecap="round"/>`
    }[s];
    return `<g transform="translate(${x} ${y}) scale(${k * sx} ${k})"><g class="eyes">${eyes}</g>${mouth}</g>`;
  }
  const sparks = (a, b) => `<path class="spark f-main" d="M${a[0]} ${a[1]} l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 z"/><path class="spark spark2 f-fx" d="M${b[0]} ${b[1]} l1.4 -4 l1.4 4 l4 1.4 l-4 1.4 l-1.4 4 l-1.4 -4 l-4 -1.4 z"/>`;
  const fx = (s, at = {}) => ({
    happy: sparks(at.sp1 || [12, 30], at.sp2 || [84, 24]),
    surprised: `<g class="${at.cls || "f-main"}"><rect x="${at.ex || 83}" y="${at.ey || 14}" width="4.5" height="13" rx="2.2"/><circle cx="${(at.ex || 83) + 2.2}" cy="${(at.ey || 14) + 18}" r="2.6"/></g>`,
    sleepy: `<text class="z ${at.cls || "f-main"}" x="${at.zx || 76}" y="${at.zy || 30}" font-family="Rubik, sans-serif" font-weight="700" font-size="11">z</text><text class="z z2 ${at.cls || "f-main"}" x="${(at.zx || 76) + 7}" y="${(at.zy || 30) - 9}" font-family="Rubik, sans-serif" font-weight="700" font-size="8">z</text>`,
    oops: `<path class="drop f-fx" d="M${at.dx || 76} ${at.dy || 44} q-4 6 0 8 q4 -2 0 -8 z"/>`
  })[s] || "";

  // ---------- B · Sprout Studio (and H, its blueprint drawing) ----------
  const antB = (x, tip, a, cls, line) => `<g transform="rotate(${a} ${x} 30)"><g class="ant ${cls}" style="transform-origin:${x}px 30px">${line
      ? `<path class="ln s-line nf" d="M${x} 30 L${tip} 16" stroke-width="1.8"/><circle class="ln s-line nf" cx="${tip}" cy="14" r="3.6" stroke-width="1.8"/>`
      : `<path class="s-main" d="M${x} 30 L${tip} 16" stroke-width="5" stroke-linecap="round"/><circle class="f-main" cx="${tip}" cy="15" r="4.5"/>`}</g></g>`;
  function markB(s = "neutral", { tile = true, line = false } = {}) {
    const [aL, aR] = POSE[s];
    const hatY = s === "surprised" ? -4 : s === "sleepy" ? 2 : 0;
    const tilt = s === "oops" ? 6 : s === "focused" ? -4 : 0;
    const head = line
      ? `<rect class="ln s-line nf" x="26" y="40" width="48" height="42" rx="11" stroke-width="1.8"/><path class="ln s-line nf" d="M30 48 Q50 54 70 48" stroke-width="1.2" stroke-dasharray="2 2"/>`
      : `<rect class="f-body" x="26" y="40" width="48" height="42" rx="11"/><path class="f-shade" d="M30 40 H70 V48 Q50 54 30 48 Z"/>`;
    const hat = line
      ? `<path class="ln s-line nf" d="M12 41 Q50 16 88 41 Q50 50 12 41 Z" stroke-width="1.8"/><path class="ln s-line nf" d="M20 42.5 Q50 49 80 42.5" stroke-width="1.2"/>`
      : `<path class="f-main" d="M12 41 Q50 16 88 41 Q50 50 12 41 Z"/><path class="f-maind" d="M20 42.5 Q50 49 80 42.5 Q50 46.5 20 42.5 Z"/>`;
    const dims = line ? `<g class="dims"><path class="s-acc" d="M26 92 H74 M26 89 V95 M74 89 V95 M84 40 V82 M81 40 H87 M81 82 H87" stroke-width="1"/><text class="f-acc" x="50" y="99" font-family="IBM Plex Mono, monospace" font-size="5.5" text-anchor="middle">48</text><text class="f-acc" x="90" y="63" font-family="IBM Plex Mono, monospace" font-size="5.5">42</text><path class="s-acc" d="M50 2 V8 M47 5 H53" stroke-width="1"/></g>` : "";
    return `<svg viewBox="0 0 100 100" class="live s-${s}" aria-hidden="true">
      ${tile && !line ? `<rect class="tile f-tile" width="100" height="100" rx="24"/>` : ""}
      ${dims}
      <g class="chr"><g transform="rotate(${tilt} 50 82)">
        <g transform="translate(0 ${hatY})">${antB(40, 35, aL, "antL", line)}${antB(60, 65, aR, "antR", line)}</g>
        <g class="head">${head}${face(s, 50, 61, 1, line ? "f-line" : "f-ink", line ? "s-line" : "s-ink")}</g>
        <g transform="translate(0 ${hatY})"><g class="hatg">${hat}</g></g>
      </g></g>
      <g class="fx">${fx(s, line ? { cls: "f-acc" } : {})}</g>
    </svg>`;
  }

  function markC(s = "neutral") {

    const white = (cx, ry = 7) => `<ellipse class="f-white" cx="${cx}" cy="64" rx="8" ry="${ry}"/>`;

  function drawMech(m) {
    const r = 9, c = Math.cos(m.th), s = Math.sin(m.th);

    m.rod.setAttribute("d", `M${a[0].toFixed(2)} ${a[1].toFixed(2)} L${b[0].toFixed(2)} ${b[1].toFixed(2)}`);

    const sp = cx => [0, 1, 2].map(i => { const t = m.th + Math.PI / 3 + i * 2.094; return `M${cx} 58 L${(cx + 11 * Math.cos(t)).toFixed(2)} ${(58 + 11 * Math.sin(t)).toFixed(2)}`; }).join(" ");

        if (cyc < 1.6) { m.th += dt * 7 * (1 - cyc / 1.6) + dt * .2; m.ok.setAttribute("opacity", 0); }
        else m.ok.setAttribute("opacity", Math.min(1, (cyc - 1.6) * 4));
      } else if (m.state === "jammed") {
        const cyc = m.t % 2.4;
        m.th = 1 + (cyc < 1.2 ? Math.sin(cyc * 40) * .12 * (1 - cyc / 1.2) : 0) + (cyc < .3 ? cyc : .3);
        m.warn.setAttribute("opacity", cyc < 1.2 ? 1 : .35);
      }
      drawMech(m);
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  mechs.forEach(drawMech);
  requestAnimationFrame(frame);
})();
</script>
