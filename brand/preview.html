<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:32px;background:#F1F2EC;font:14px/1.4 system-ui;color:#1D2420;display:grid;grid-template-columns:repeat(4,auto);gap:28px;align-items:end;justify-content:start}
.c{display:grid;gap:8px;justify-items:center}
.dark{background:#1D2420;padding:16px;border-radius:12px;color:#F1F2EC}
.mono img{filter:grayscale(1) contrast(1.4)}
.row{display:flex;gap:14px;align-items:end}
.tile{background:#B6D97A;border-radius:22%;display:grid;place-items:center}
</style></head><body>
<div class="c"><img src="mascot.svg" width="320"><span>Full mascot</span></div>
<div class="c dark"><img src="mascot.svg" width="200"><span>On dark</span></div>
<div class="c mono"><img src="mascot.svg" width="200"><span>Greyscale</span></div>
<div class="c"><div class="row">
<div class="tile" style="width:96px;height:96px"><img src="mark.svg" width="80"></div>
<div class="tile" style="width:48px;height:48px"><img src="mark.svg" width="40"></div>
<div class="tile" style="width:32px;height:32px"><img src="mark.svg" width="27"></div>
<div class="tile" style="width:16px;height:16px"><img src="mark.svg" width="14"></div></div><span>Head mark · 96 · 48 · 32 · 16 px</span></div>
</body></html>
