<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ash Dev mascot</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #EEF0EA; font: 14px/1.4 system-ui, sans-serif; color: #27302B; }
  #bot { width: min(78vw, 380px); cursor: pointer; touch-action: manipulation; user-select: none; }
  #bot svg { width: 100%; height: auto; display: block; }
  p { text-align: center; margin: 12px 0 0; opacity: .6; }
</style>
</head>
<body>
<div>
  <div id="bot" role="button" tabindex="0" aria-label="Poke the mascot"></div>
  <p>Click or tap him.</p>
</div>
<script src="robot.js"></script>
<script>
// The head hops; the hat and antennae hang off it on damped springs, so they lag and overshoot.
const host = document.getElementById("bot");
host.innerHTML = robot({});
const svg = host.querySelector("svg");
const head = svg.querySelector(".head");
const hatRig = svg.querySelector(".hat").parentNode;
const hatBase = hatRig.getAttribute("transform") || "";
const ant = svg.querySelector(".antennae");
const body = svg.querySelector(".body");
const pupils = [...svg.querySelectorAll(".pupil")];

const hop = { y: 0, v: 0 };
const hat = { x: 0, v: 0, k: 260, d: 10 }, wob = { x: 0, v: 0, k: 120, d: 4 };
const spring = (s, target, dt) => { s.v += (-s.k * (s.x - target) - s.d * s.v) * dt; s.x += s.v * dt; };
let last = performance.now(), nextBlink = 1.5, blink = 0;

function poke() { if (hop.y > -2) hop.v = -480; wob.v += (Math.random() < 0.5 ? -1 : 1) * 60; }
host.addEventListener("pointerdown", poke);
host.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); poke(); } });

function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
  hop.v += 1700 * dt; hop.y += hop.v * dt;
  if (hop.y > 0) { if (hop.v > 150) { hat.v += hop.v * 0.8; wob.v += hop.v * 0.08; } hop.y = 0; hop.v = 0; }
  spring(hat, hop.y, dt); spring(wob, 0, dt);
  head.setAttribute("transform", `translate(0 ${hop.y.toFixed(2)})`);
  body.setAttribute("transform", `translate(0 ${(hop.y * 0.55).toFixed(2)})`);
  hatRig.setAttribute("transform", `translate(0 ${hat.x.toFixed(2)}) ${hatBase}`);
  ant.setAttribute("transform", `rotate(${wob.x.toFixed(2)} 256 110)`);
  nextBlink -= dt;
  if (nextBlink < 0) { blink = 0.13; nextBlink = 2 + Math.random() * 3; }
  blink = Math.max(0, blink - dt);
  pupils.forEach(p => p.setAttribute("transform", blink > 0 ? "translate(0 276) scale(1 .25) translate(0 -276)" : ""));
  requestAnimationFrame(frame);
}
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) requestAnimationFrame(frame);
</script>
</body>
</html>
